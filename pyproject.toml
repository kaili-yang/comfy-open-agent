[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "comfy-open-agent"
version = "0.2.0"
description = "Open-source ComfyUI agent with MCP support"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Comfy Open Agent Contributors"}
]
keywords = ["comfyui", "agent", "mcp", "ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "anthropic>=1.0.0",
    "openai>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/yourusername/comfy-open-agent"
Repository = "https://github.com/yourusername/comfy-open-agent"
Issues = "https://github.com/yourusername/comfy-open-agent/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["*.json", "*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
